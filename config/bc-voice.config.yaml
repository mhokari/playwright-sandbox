# Configuration for the Brand Concierge Voice E2E tests.
# Edit these values to point the suite at a different environment, message, or
# fixtures without touching the test code.

# The page under test.
url: "https://d3mey6isb8np59.cloudfront.net/dsg-bc-voice/index.html"

# The message used for the text test, and spoken in the generated voice fixtures.
# If you change this, regenerate the audio: ./scripts/generate-audio.sh
textMessage: "I am preparing a full marathon and want to have a pair of new shoes."

# A reply passes when its word count is at least this value. The text/dictate reply
# is often a short clarifying question (~15 words), so keep this a modest floor that
# still distinguishes a real answer from an empty/error reply.
minResponseWords: 8

# Prerecorded voice fixtures (relative to the repo root). Both modes default to the
# same file but can be pointed at different recordings.
audio:
  dictate: "fixtures/audio/marathon-message.wav"
  voice: "fixtures/audio/marathon-message.wav"

# Timeouts in milliseconds.
timeouts:
  # How long to wait for the AI response to finish generating.
  responseMs: 60000
  # How long to wait for individual UI actions/elements.
  actionMs: 15000
